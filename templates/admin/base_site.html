{% extends "admin/base.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  /* Cannabis-green admin theme */
  #header { background: #1B5E20 !important; }
  #header a, #header a:visited { color: #fff !important; }
  #header #branding h1 a, #header #branding h1 a:visited { color: #fff !important; }
  div.breadcrumbs { background: #2E7D32; color: #C8E6C9; }
  div.breadcrumbs a { color: #A5D6A7; }
  div.breadcrumbs a:hover { color: #fff; }
  .module h2, .module caption, .inline-group h2 {
    background: #2E7D32 !important; color: #fff !important;
  }
  a:link, a:visited { color: #2E7D32; }
  a:hover { color: #1B5E20; }
  .button, input[type=submit], input[type=button],
  .submit-row input, a.button {
    background: #4CAF50; border: none; color: #fff;
  }
  .button:hover, input[type=submit]:hover { background: #1B5E20 !important; }
  .button.default, input[type=submit].default { background: #1B5E20; }
  #changelist-filter h2 { background: #2E7D32; color: #fff; }
  #changelist-filter li.selected a { color: #1B5E20; font-weight: bold; }
  .object-tools a { background: #4CAF50; }
  .object-tools a:hover { background: #1B5E20; }
  .nav-sidebar .current-app .section:link,
  .nav-sidebar .current-app .section:visited { color: #1B5E20; }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">
    <i class="fas fa-leaf" style="color:#A5D6A7;margin-right:8px;"></i>
    {% trans "MedicalStore Admin" %}
  </a>
</h1>
{% endblock %}
